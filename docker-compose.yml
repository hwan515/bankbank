services:
  backend:
    image: hwan515/bankbank-be:latest
    container_name: bankbank-backend
    restart: unless-stopped
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DEBUG: ${DEBUG:-False}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-bank.cocohwan.site}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://bank.cocohwan.site}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-https://bank.cocohwan.site}
      MYSQL_HOST: ${MYSQL_HOST}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_DB: ${MYSQL_DB}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT:-6379}
      FIN_API_KEY: ${FIN_API_KEY}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY}
      DATA_GO_KR_KEY: ${DATA_GO_KR_KEY}
      GMS_KEY: ${GMS_KEY}
      GMS_BASE_URL: ${GMS_BASE_URL:-https://gms.ssafy.io/gmsapi/api.openai.com/v1}
      GMS_MODEL: ${GMS_MODEL:-gpt-4o-mini}
    ports:
      - "18000:8000"
    networks:
      - app-net

  frontend:
    image: hwan515/bankbank-fe:latest
    container_name: bankbank-frontend
    restart: unless-stopped
    ports:
      - "18080:80"
    networks:
      - app-net

networks:
  app-net:
    name: ${DOCKER_NETWORK:-bankbank-net}
