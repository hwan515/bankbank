services:
  backend:
    image: hwan515/bankbank-be:latest
    container_name: bankbank-backend
    restart: unless-stopped
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DEBUG: ${DEBUG:-False}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-bank.cocohwan.site}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://bank.cocohwan.site}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-https://bank.cocohwan.site}
      MYSQL_HOST: ${MYSQL_HOST}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_DB: ${MYSQL_DB}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT:-6379}
      FIN_API_KEY: ${FIN_API_KEY}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY}
      DATA_GO_KR_KEY: ${DATA_GO_KR_KEY}
      KAKAO_REST_API_KEY: ${KAKAO_REST_API_KEY}
      GMS_KEY: ${GMS_KEY}
      GMS_BASE_URL: ${GMS_BASE_URL:-https://gms.ssafy.io/gmsapi/api.openai.com/v1}
      GMS_MODEL: ${GMS_MODEL:-gpt-4o-mini}
      CHROMA_HOST: ${CHROMA_HOST:-chroma}
      CHROMA_PORT: ${CHROMA_PORT:-8000}
      CHROMA_SSL: ${CHROMA_SSL:-false}
      CHROMA_COLLECTION: ${CHROMA_COLLECTION:-cards_top100_text}
      EMBED_MODEL: ${EMBED_MODEL:-text-embedding-3-large}
    ports:
      - "18000:8000"
    depends_on:
      - chroma
    networks:
      - app-net

  chroma:
    image: chromadb/chroma:1.3.7
    container_name: bankbank-chroma
    restart: unless-stopped
    environment:
      IS_PERSISTENT: "TRUE"
      PERSIST_DIRECTORY: /chroma/chroma
      ANONYMIZED_TELEMETRY: "FALSE"
    ports:
      - "127.0.0.1:18081:8000"
    volumes:
      - chroma-data:/chroma/chroma
    networks:
      - app-net

  frontend:
    image: hwan515/bankbank-fe:latest
    container_name: bankbank-frontend
    restart: unless-stopped
    ports:
      - "18080:80"
    networks:
      - app-net

networks:
  app-net:
    name: ${DOCKER_NETWORK:-bankbank-net}

volumes:
  chroma-data:
